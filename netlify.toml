[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # The accounts desk: invoices, proformas, notes, receipts, payments,
  # outstanding, payables and the agent statement, plus the Costs and Invoices
  # sections of a shipment and the Billing section of a case file.
  #
  # It has to be said here. `off` is the default in src/lib/features.ts, and
  # .env.local is gitignored so a deploy never sees it — without this line the
  # deployed build would come up without the desk.
  VITE_ACCOUNTS_DESK = "on"
  # The full case file: Details, Partners & quote, Documents and Billing
  # alongside Mail and Timeline. Anything other than "full" leaves the enquiry
  # as mail and its history only.
  VITE_CASE_FILE = "full"
  # Maintenance: every screen of the desk shows "Under maintenance" (the
  # customers' /q/ and /t/ pages keep working). Set to "off" and push to open
  # the desk again.
  VITE_MAINTENANCE = "on"
  # VITE_API_BASE and VITE_MOCK_BACKEND were removed on 1 Oct 2026, with the
  # voice-era REST paths they switched (services/backend.ts). Nothing in the app
  # reads either now; v2 reads and writes through Supabase directly. Never point
  # anything here at v1's project (`wremiarcmppuncgfzrqb`), which shares a
  # SnapServe account with the live voice agents.

# The CRM is a single-page app using client-side routing. Without this, every deep link
# (/shipments/in-process, /knowledge-base) 404s on refresh or when shared, because Netlify
# looks for a file at that path and there isn't one.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Hashed asset filenames change on every build, so they can be cached indefinitely.
# The service worker and the manifest are read fresh every time, so a deploy
# reaches the home-screen app on its next open rather than whenever a cache
# decides to let go.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The sign-in video and its poster. Named by version (login-v2.mp4), so a new
# clip gets a new name and these can be kept as long as the hashed assets.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
